aid: voltaiq
name: Voltaiq
description: 'Voltaiq is an enterprise battery intelligence (EBI) software company that
  automatically collects, cleans and harmonizes data from battery test equipment, production
  lines and fielded systems into a single searchable data core, then extracts electrochemical
  quality indicators, KPIs and traceability for battery R&D, product development, manufacturing
  and in-field applications. The platform ships no-code dashboards, an Analytics Studio Python
  data-science environment, and pre-built integrations with industry-standard cyclers (NOVONIX,
  MACCOR, Arbin, Biologic, Bitrode, Digatron, Neware, Gamry, Chroma, Keysight) alongside LIMS,
  MES and BI tools. Voltaiq states it offers "an API that enables flexible custom integrations",
  but every customer system is deployed into its own single-tenant AWS VPC and the company
  publishes no public developer portal, API reference or machine-readable contract: its security
  page says "Full technical documentation is available upon request."'
